log_format rookhposh_dash_json escape=json '{"time":"$time_iso8601","request_id":"$request_id","remote_addr":"$remote_addr","method":"$request_method","uri":"$uri","status":$status,"request_time":$request_time}';
limit_req_zone $binary_remote_addr zone=rookhposh_dash_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=rookhposh_dash_pro:10m rate=2r/m;
limit_req_zone $binary_remote_addr zone=rookhposh_dash_test_otp:10m rate=10r/m;
limit_req_zone $server_name zone=rookhposh_dash_test_otp_all:1m rate=60r/m;
limit_conn_zone $binary_remote_addr zone=rookhposh_dash_pro_ip:10m;
limit_conn_zone $server_name zone=rookhposh_dash_pro_all:1m;

server {
    listen 80;
    server_name dash.rookhposh.ir;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/rookhposh/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://dash.rookhposh.ir$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name dash.rookhposh.ir;
    include snippets/rookhposh-tls.conf;
    root /var/www/rookhposh-dash/current;
    index index.html;
    client_max_body_size 6m;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
    if ($http_content_encoding != "") { return 415; }
    access_log /var/log/nginx/rookhposh-dash.access.log rookhposh_dash_json;
    error_log /var/log/nginx/rookhposh-dash.error.log warn;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self' https://cdn.kavenegar.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://cdn.kavenegar.com https://console.kavenegar.com https://sentry.kavenegar.com; media-src 'self' blob:; worker-src 'self' blob:; form-action 'self'; upgrade-insecure-requests" always;

    location = /kvn-push-sw.js {
        default_type application/javascript;
        expires -1;
        try_files $uri =404;
    }

    # Temporary test OTP display requested by the owner; no SMS is sent.
    location ~* ^/api/auth/otp/(?<dash_otp_endpoint>request|verify)/?$ {
        limit_except POST { deny all; }
        client_max_body_size 16k;
        limit_req zone=rookhposh_dash_test_otp burst=8 nodelay;
        limit_req zone=rookhposh_dash_test_otp_all burst=20 nodelay;
        limit_req_status 429;
        add_header Cache-Control "no-store" always;
        add_header X-Rookhposh-Auth-Mode "test" always;
        rewrite ^ /api/auth/otp/$dash_otp_endpoint break;
        proxy_pass http://127.0.0.1:5050;
        include snippets/rookhposh-dash-proxy.conf;
    }
    location ~* ^/api/auth/(?:otp|register|forgot-password)(?:/|$) {
        default_type application/json;
        add_header Cache-Control no-store always;
        return 503 '{"success":false,"message":"ورود پیامکی موقتاً در دسترس نیست."}';
    }
    location ~* ^/api/payments/omidpay/callback(?:/|$) {
        default_type application/json;
        add_header Cache-Control no-store always;
        return 503 '{"success":false,"message":"درگاه پرداخت هنوز فعال نشده است."}';
    }
    location ~* ^/api/auth/login/?$ {
        limit_req zone=rookhposh_dash_login burst=5 nodelay;
        limit_req_status 429;
        rewrite ^ /api/auth/login break;
        proxy_pass http://127.0.0.1:5050;
        include snippets/rookhposh-dash-proxy.conf;
    }
    location = /health {
        proxy_pass http://127.0.0.1:5050/health;
        include snippets/rookhposh-dash-proxy.conf;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:5050;
        include snippets/rookhposh-dash-proxy.conf;
    }
    location ~ ^/pro-api/(?<dash_pro_endpoint>try-on|m1|m2)$ {
        limit_except POST { deny all; }
        client_max_body_size 32m;
        limit_req zone=rookhposh_dash_pro burst=1 nodelay;
        limit_req_status 429;
        limit_conn rookhposh_dash_pro_ip 2;
        limit_conn rookhposh_dash_pro_all 4;
        proxy_request_buffering on;
        proxy_read_timeout 310s;
        proxy_send_timeout 90s;
        rewrite ^ /pro-api/$dash_pro_endpoint break;
        proxy_pass http://127.0.0.1:5050;
        include snippets/rookhposh-dash-proxy.conf;
    }
    location /pro-api { return 404; }
    location ~ /\. { return 404; }
    location ~* \.(sql|env|bak|log|ini|php)$ { return 404; }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }
    location = /index.html {
        expires -1;
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
